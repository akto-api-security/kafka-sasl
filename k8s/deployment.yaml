apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-producer-api
  labels:
    app: kafka-producer-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-producer-api
  template:
    metadata:
      labels:
        app: kafka-producer-api
    spec:
      containers:
      - name: kafka-producer-api
        image: kafka-producer-api:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
      restartPolicy: Always
